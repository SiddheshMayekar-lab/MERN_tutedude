<!doctype html>
<html>
  <head>
    <title>Product Page</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <header class="navbar">
      <div class="logo">
        <h2>Thala 7</h2>
      </div>

      <nav class="menu">
        <a href="index.html">Home</a>
        <a href="#">Shop</a>
      </nav>

      <div class="icons">
        <i class="fa-solid fa-magnifying-glass"></i>
        <a href="cart.html">
          <i class="fa-solid fa-cart-shopping"></i>
        </a>
        <i class="fa-solid fa-user"></i>
      </div>
    </header>

    <section class="product">
      <div class="product-image">
        <img src="images/sneaker-hero.png" />
      </div>

      <div class="product-details">
        <h2>Thala 7 Sneaker</h2>

        <p>Premium comfort sneaker designed for everyday wear.</p>

        <h3>$120</h3>

        <label>Quantity</label>
        <input type="number" value="1" />

        <a href="cart.html" class="btn" style="text-decoration: none"
          >Add To Cart</a
        >
      </div>
    </section>

    <section class="gallery">
      <img src="images/sneaker-above.png" />
      <img src="images/sneaker-zoom.png" />
      <img src="images/sneaker-left.png" />
      <img src="images/sneaker-right.png" />
      <img src="images/sneaker-bottom.png" />
    </section>
  </body>
</html>
