<!DOCTYPE html>
<html>
<head>
    <title>Laundry Mart Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Left Side Image -->
        <div class="left">
            <img src="images/laundry1.jpg" alt="Laundry Image">
        </div>

        <!-- Right Side Form -->
        <div class="right">
            <div class="login-box">
                <h2>Hello Again!</h2>
                <p>Welcome back we missed you!</p>

                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>

                <button class="login-btn">Login</button>
            </div>
        </div>

    </div>

</body>
</html>
