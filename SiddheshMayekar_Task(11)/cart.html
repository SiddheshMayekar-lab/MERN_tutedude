<!doctype html>
<html>
  <head>
    <title>Thala 7 Sneaker Store</title>

    <link rel="stylesheet" href="css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>

    <header class="navbar">

      <h2>Thala 7</h2>

      <nav class="menu">
        <a href="index.html">
          <i class="fa-solid fa-house"></i> Home
        </a>
      </nav>

    </header>


    <section class="cart-container">

      <div class="cart-left">

        <h2>Shopping Cart</h2>

        <table>
          <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Remove</th>
          </tr>

          <tr>
            <td>Sneaker</td>
            <td>1</td>
            <td>$120</td>
            <td>
              <i class="fa-solid fa-trash"></i>
            </td>
          </tr>

        </table>

      </div>



      <div class="cart-right">

        <h3>Apply Coupon</h3>

        <input type="text" placeholder="Enter Coupon" />

        <button class="btn">Apply</button>


        <div class="summary">

          <p>Sub Total : $120</p>
          <p>Taxes : $10</p>
          <p>Discount : $5</p>

          <h3>Total : $125</h3>

          <a href="payment.html">
            <button class="btn">Pay Now</button>
          </a>

        </div>

      </div>

    </section>

  </body>
</html>
