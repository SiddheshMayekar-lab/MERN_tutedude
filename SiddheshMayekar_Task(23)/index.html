<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppName</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="font-sans">
    <header class="bg-white shadow sticky top-0">
      <div
        class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center"
      >
        <h1 class="text-lg font-semibold">AppName</h1>

        <nav class="hidden md:flex gap-6 text-sm">
          <a href="#">Features</a>
          <a href="#">Pricing</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </nav>
        <button id="menuBtn" class="md:hidden text-xl">
          <i class="fas fa-bars"></i>
        </button>
      </div>
      <div id="mobileMenu" class="hidden flex flex-col px-4 pb-4 md:hidden">
        <a href="#" class="py-2">Features</a>
        <a href="#" class="py-2">Pricing</a>
        <a href="#" class="py-2">About</a>
        <a href="#" class="py-2">Contact</a>
      </div>
    </header>
    <section class="bg-indigo-500 text-white">
      <div
        class="max-w-7xl mx-auto px-4 py-12 flex flex-col lg:flex-row items-center gap-8"
      >
        <div class="lg:w-1/2">
          <h2 class="text-2xl md:text-3xl font-bold mb-4">
            Build Products Faster
          </h2>
          <p class="text-sm mb-5">
            Simple tools to design and grow your product without complexity.
          </p>
          <div class="flex gap-3 flex-wrap">
            <button class="bg-white text-black px-4 py-2 rounded">Start</button>
            <button class="border px-4 py-2 rounded">Demo</button>
          </div>
        </div>
        <div class="lg:w-1/2 w-full">
          <img
            src="https://images.unsplash.com/photo-1559028012-481c04fa702d"
            class="w-full h-64 object-cover rounded"
          />
        </div>
      </div>
    </section>
    <section class="py-12">
      <div class="max-w-7xl mx-auto px-4">
        <h3 class="text-xl font-semibold text-center mb-8">Features</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
          <div class="border p-4 rounded">
            <h4 class="font-semibold mb-2">Fast</h4>
            <p class="text-sm">Runs smoothly.</p>
          </div>
          <div class="border p-4 rounded">
            <h4 class="font-semibold mb-2">Secure</h4>
            <p class="text-sm">Your data is safe.</p>
          </div>
          <div class="border p-4 rounded">
            <h4 class="font-semibold mb-2">Easy</h4>
            <p class="text-sm">Simple to use.</p>
          </div>
        </div>
      </div>
    </section>
    <footer class="bg-black text-white text-center py-4">
      <p class="text-sm">© 2026 AppName</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
