<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Workspace</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body class="text-gray-800 bg-white">
    <nav class="sticky top-0 z-50 bg-white border-b">
      <div
        class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between"
      >
        <div class="font-semibold text-lg">✦ Project</div>

        <div class="hidden md:flex items-center gap-6 text-sm">
          <a href="#">Product</a>
          <a href="#">Solutions</a>
          <a href="#">Resources</a>
          <a href="#">Pricing</a>
          <a href="#">Log in</a>

          <button class="bg-black text-white px-4 py-2 rounded-md">
            Get AI free
          </button>
        </div>
      </div>
    </nav>

    <section
      class="relative bg-gradient-to-b from-orange-100 to-white pt-20 pb-24 overflow-hidden"
    >
      <div class="max-w-5xl mx-auto text-center px-4">
        <h1 class="text-4xl md:text-5xl font-bold leading-tight">
          Write, plan, share.
        </h1>

        <p class="mt-3 text-lg text-gray-600">With AI at your side.</p>

        <p class="mt-4 text-gray-500 max-w-xl mx-auto">
          Bring your notes, tasks, and teams into one simple workspace. Designed
          to keep everything moving without feeling complicated.
        </p>

        <div class="mt-6 flex justify-center gap-4">
          <button class="bg-black text-white px-6 py-3 rounded-md">
            Get AI free →
          </button>

          <button class="border px-6 py-3 rounded-md">Request a demo</button>
        </div>
      </div>

      <div class="relative max-w-5xl mx-auto mt-16 px-4">
        <img
          src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=1200&auto=format&fit=crop"
          alt="Dashboard"
          class="rounded-xl shadow-lg mx-auto"
        />

        <div
          class="absolute top-4 left-4 bg-white px-4 py-3 rounded-lg shadow text-sm flex items-center gap-2"
        >
          <i class="fa-solid fa-list-check text-gray-600"></i>
          <span>12 tasks completed today</span>
        </div>

        <div
          class="absolute bottom-4 left-8 bg-white px-4 py-3 rounded-lg shadow text-sm flex items-center gap-2"
        >
          <i class="fa-solid fa-circle-check text-green-500"></i>
          <span>On Track</span>
        </div>

        <div
          class="absolute top-8 right-4 bg-white px-4 py-3 rounded-lg shadow text-sm flex items-center gap-3"
        >
          <div class="flex -space-x-2">
            <img
              src="https://i.pravatar.cc/30?img=1"
              class="w-6 h-6 rounded-full border"
            />
            <img
              src="https://i.pravatar.cc/30?img=2"
              class="w-6 h-6 rounded-full border"
            />
            <img
              src="https://i.pravatar.cc/30?img=3"
              class="w-6 h-6 rounded-full border"
            />
          </div>

          <span class="text-gray-600">+5 online</span>
        </div>
      </div>
    </section>

    <div class="fixed bottom-6 right-6 z-50">
      <button
        class="bg-black text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center"
      >
        <i class="fa-solid fa-comment-dots text-lg"></i>
      </button>
    </div>
  </body>
</html>
