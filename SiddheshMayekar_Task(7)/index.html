<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laundry Mart · fresh care</title>
    <!-- Font Awesome 6 (free) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NAVBAR – refined, subtle shadow, friendly -->
    <nav class="navbar">
      <div class="logo">
        <i class="fa-solid fa-soap"></i>
        Laundry Mart
      </div>

      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>

      <div class="user-profile">
        <div class="initial">S</div>
        <span class="full-name">Siddhesh</span>
      </div>
    </nav>

    <!-- HERO – welcoming, bright, exactly as described -->
    <section class="hero">
      <div class="hero-left">
        <h1>
          Professional Laundry Service
          <span>At Your Doorstep</span>
        </h1>

        <p>
          Reliable pickup, premium garment care, and fast delivery. Experience
          modern laundry solutions designed for your convenience.
        </p>

        <div class="hero-buttons">
          <button class="primary-btn">
            <i class="fa-solid fa-basket-shopping"></i>
            Book Service
          </button>

          <button class="secondary-btn">
            <i class="fa-solid fa-phone"></i>
            Contact Us
          </button>
        </div>

        <!-- feature pills add trust & clarity -->
        <div class="hero-features">
          <div class="feature">
            <i class="fa-solid fa-truck"></i>
            <span>Free Pickup</span>
          </div>
          <div class="feature">
            <i class="fa-solid fa-shirt"></i>
            <span>Premium Care</span>
          </div>
          <div class="feature">
            <i class="fa-solid fa-clock"></i>
            <span>24 Hour Delivery</span>
          </div>
        </div>
      </div>

      <div class="hero-right">
        <img
          src="https://images.unsplash.com/photo-1604335399105-a0c585fd81a1?q=80&w=800&auto=format&fit=crop"
          alt="Modern laundry room with washing machines"
          loading="lazy"
        />
      </div>
    </section>
  </body>
</html>
